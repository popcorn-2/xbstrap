image efi.vfat {
    vfat {}
    size = 64M
    mountpoint = "/efi"
}

image rootfs.vfat {
    vfat {}
    size = 64M
}

image popcorn.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition boot {
        partition-type-uuid = "U"
        image = "efi.vfat"
        bootable = true
    }

    partition root {
        partition-type-uuid = "8A6CC16C-D110-46F1-813F-0382046342C8"
        image = "rootfs.vfat"
    }
}
